  <body>
    <!-- #308 LCP: the index's heading as static HTML (the same markup as src/pages/NewsPage.tsx), painted before any JS;
         src/engine/first-screen.ts requests the app once it is on screen, and React's render takes its place, same box.
         An article (/news/<slug>) has another heading: the script drops it there, and the app boots at once. -->
    <div id="root"><div class="doc" data-first-screen><main class="doc-main"><header class="section__head"><p class="eyebrow">News</p><h1 class="section__title">News &amp; updates</h1></header></main></div></div>
    <script>if(/^\/news\/./.test(location.pathname))document.getElementById('root').textContent=''</script>
    <script type="module" src="/src/news-main.tsx"></script>
  </body>
</html>
